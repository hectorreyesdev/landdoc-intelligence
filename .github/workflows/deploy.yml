name: Deploy to Azure Container Apps

# Auto-deploy on merge to main: rebuild the single image (SPA + API) and roll a new Azure Container
# Apps revision. Auth is passwordless via OIDC federated credentials — no Azure secret is stored in
# GitHub (only the client/tenant/subscription IDs). Runtime secrets are NOT handled here: they stay in
# Key Vault and are read at startup by the container's managed identity. Setup + rationale: see
# knowledge/docs/CICD.md and ADR-0016. The CI workflow (ci.yml / frontend-ci.yml) gates PRs; this only
# runs once a PR has merged to main.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

env:
  RESOURCE_GROUP: rg-landdoc-deomo
  CONTAINERAPP: landdoc
  ACR_NAME: ca6a00db456cacr
  IMAGE_REPO: landdoc

jobs:
  deploy:
    name: build & deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REPO:${{ github.sha }}" \
            --image "$IMAGE_REPO:latest" \
            --file Dockerfile .

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "$CONTAINERAPP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_REPO:${{ github.sha }}"

      - name: Show URL
        run: |
          FQDN=$(az containerapp show -n "$CONTAINERAPP" -g "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Deployed: https://$FQDN/" >> "$GITHUB_STEP_SUMMARY"
